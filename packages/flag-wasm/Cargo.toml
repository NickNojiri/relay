[package]
name = "flag-wasm"
description = "WebAssembly (wasm-bindgen) binding for the Relay flag-core engine — the edge/browser path."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flag-core = { path = "../flag-core", features = ["serde"] }
wasm-bindgen = "0.2"
