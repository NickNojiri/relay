[package]
name = "flag-node"
description = "Node.js (napi-rs) binding for the Relay flag-core engine."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
flag-core = { path = "../flag-core", features = ["serde"] }
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
