version: "3.8"

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Ollama (optional LLM for local experimentation)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to run `ollama pull llama2` on startup (takes time on first run)
    # entrypoint: sh -c "ollama serve & sleep 5 && ollama pull llama2 && wait"

  # Relay gateway (FastAPI)
  gateway:
    build:
      context: .
      dockerfile: services/prompt-ops/Dockerfile
    environment:
      DATABASE_URL: "postgresql://relay:relay@postgres:5432/relay"
      RELAY_DB_ENABLED: "true"
      RELAY_DEFAULT_PROVIDER: "echo"
      RELAY_DEFAULT_MODEL: "demo"
      RELAY_API_KEYS: "demo-key-12345"
      RELAY_RATE_LIMIT_PER_MINUTE: "60"
      PROMPT_OPS_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Relay sync server (Node.js WebSocket)
  sync-server:
    build:
      context: .
      dockerfile: services/sync-server/Dockerfile
    environment:
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      - gateway

  # Relay studio (Next.js frontend)
  studio:
    build:
      context: apps/studio
      dockerfile: Dockerfile
    environment:
      # Server-side
      DATABASE_URL: "postgresql://relay:relay@postgres:5432/relay"
      PROMPT_OPS_URL: "http://gateway:8000"
      PROMPT_OPS_API_KEY: "demo-key-12345"
      # Public (browser)
      NEXT_PUBLIC_SYNC_URL: "ws://localhost:3001"
    ports:
      - "3000:3000"
    depends_on:
      - gateway
      - sync-server
      - postgres

volumes:
  postgres_data:
  ollama_data:

networks:
  default:
    name: relay-network
