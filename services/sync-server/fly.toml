# fly deploy --config services/sync-server/fly.toml
# NB: Fly app names are globally unique — plain "relay-sync" is taken by another account.
app = "relay-sync-nojiri"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 1234
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
