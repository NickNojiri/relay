# Gateway HTTP overhead toward a provider: the gateway calls an Ollama-compatible stand-in
# server (loadtest/stub_upstream.py) that answers instantly, so the numbers show what the
# gateway's own provider calls cost (client setup, connections), not model latency.
name = "ollama-stub"

[upstream]
# Launched by bench.py before the gateway.
port = 8766
delay_ms = 0

[gateway]
port = 8765
workers = 1
access_log = false
env = { RELAY_DEFAULT_PROVIDER = "ollama", RELAY_DEFAULT_MODEL = "stub", OLLAMA_BASE_URL = "http://127.0.0.1:8766", RELAY_DB_ENABLED = "false", RELAY_API_KEYS = "", RELAY_RATE_LIMIT_PER_MINUTE = "0", RELAY_OTEL_ENABLED = "false" }

[load]
endpoint = "/v1/chat"
prompt_key = "prompt.support-bot"
input = "hello"
unit_ids = 10000
seed = 1
concurrency = [1, 10, 50]
warmup_s = 2
duration_s = 10
repeats = 3
timeout_s = 30
