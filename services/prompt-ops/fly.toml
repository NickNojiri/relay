# fly deploy --config services/prompt-ops/fly.toml
app = "relay-prompt-ops"
primary_region = "sjc"

# Graceful shutdown: send SIGTERM and wait longer than uvicorn's 30 s drain
# window (Dockerfile) before Fly force-kills the machine. Fly's default is
# SIGINT with a 5 s wait, which would cut long streams off mid-answer.
kill_signal = "SIGTERM"
kill_timeout = 35

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  RELAY_DB_ENABLED = "true"
  RELAY_DEFAULT_PROVIDER = "anthropic"
