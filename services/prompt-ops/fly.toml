# fly deploy --config services/prompt-ops/fly.toml
app = "relay-prompt-ops"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  RELAY_DB_ENABLED = "true"
  RELAY_DEFAULT_PROVIDER = "anthropic"
