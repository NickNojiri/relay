name: Deploy services

# Deploys the two long-lived Fly services.
# Studio (Next.js) is deployed by Vercel's GitHub integration, not here.
#
# Required GitHub Actions secrets:
#   FLY_API_TOKEN      - Fly personal access token (org-scoped, so it can create apps)
#   DATABASE_URL       - Neon Postgres connection string
#   ANTHROPIC_API_KEY  - provider key for the gateway
#   RELAY_API_KEYS     - gateway API key(s); the studio's PROMPT_OPS_API_KEY must be one of them
#
# Trigger manually from the Actions tab ("Run workflow"), or automatically on push to main.
on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "packages/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  prompt-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure app exists
        run: flyctl apps create relay-prompt-ops --org personal || echo "app already exists"
      - name: Stage secrets
        run: >
          flyctl secrets set --app relay-prompt-ops --stage
          DATABASE_URL="${{ secrets.DATABASE_URL }}"
          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          RELAY_API_KEYS="${{ secrets.RELAY_API_KEYS }}"
          RELAY_DB_ENABLED=true
          RELAY_DEFAULT_PROVIDER=anthropic
          RELAY_DEFAULT_MODEL=claude-3-5-haiku-latest
          RELAY_RATE_LIMIT_PER_MINUTE=60
      - name: Deploy
        run: >
          flyctl deploy --remote-only
          --config services/prompt-ops/fly.toml
          --dockerfile services/prompt-ops/Dockerfile
          services/prompt-ops

  sync-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure app exists
        run: flyctl apps create relay-sync --org personal || echo "app already exists"
      - name: Deploy
        run: >
          flyctl deploy --remote-only
          --config services/sync-server/fly.toml
          --dockerfile services/sync-server/Dockerfile
          .
