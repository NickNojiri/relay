# Rust workspace for the flag engine: `flag-core` (the verified rule-eval core)
# plus the Phase 4b binding crates, each a thin wrapper over `flag_core::evaluate_json`.
[workspace]
resolver = "2"
members = [
    "packages/flag-core",
    "packages/flag-node", # napi-rs Node addon
    "packages/flag-wasm", # wasm-bindgen edge/browser
    "packages/flag-py",   # PyO3 Python wheel
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Nick Nojiri"]

[profile.release]
lto = true
codegen-units = 1
